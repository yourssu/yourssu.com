name: CI

on: pull_request

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Setup pnpm
        # v6.0.3
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e

      - name: Setup Node.js
        # v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test analytics
        run: pnpm test:analytics

      - name: Check analytics metadata migration
        run: pnpm check:analytics-metadata

      - name: Typecheck Studio
        run: pnpm --dir studio run typecheck

      - name: Build Studio
        run: pnpm --dir studio run build

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check
