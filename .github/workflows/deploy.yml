name: build-and-deploy

on:
  release:
    types: [published]
  repository_dispatch:
    types: [sanity-content-update]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://yourssu.com
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve deployment tag
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "repository_dispatch" ]]; then
            tag="$(
              gh api "repos/$GITHUB_REPOSITORY/releases/latest" \
                --jq '.tag_name'
            )"
          else
            tag="$RELEASE_TAG"
          fi
          echo "Deploying $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        # v6.0.2
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ steps.deployment.outputs.tag }}
          persist-credentials: false

      - name: Setup pnpm
        # v6.0.3
        uses: pnpm/action-setup@903f9c1a6ebcba6cf41d87230be49611ac97822e

      - name: Setup Node.js
        # v6.4.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.15.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Validate approved breaking GraphQL cutover (forced dry-run)
        if: github.event_name == 'release'
        run: >-
          pnpm --dir studio exec sanity graphql deploy --dry-run --force
          --dataset production
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Deploy GraphQL API
        if: github.event_name == 'release'
        run: pnpm --dir studio exec sanity graphql deploy --force
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}

      - name: Clean Gatsby build
        run: pnpm clean

      - name: Generate Environment Variables File for Production
        run: |
          {
            echo "GATSBY_APP_SANITY_TOKEN=$GATSBY_APP_SANITY_TOKEN"
            echo "GATSBY_APP_SANITY_PROJECT_ID=$SANITY_PROJECT_ID"
            echo "GATSBY_APP_SANITY_DATASET=$GATSBY_APP_SANITY_DATASET"
            echo "GATSBY_APP_GA_ID=$GATSBY_APP_GA_ID"
            echo "GATSBY_APP_POSTHOG_KEY=$GATSBY_APP_POSTHOG_KEY"
            echo "GATSBY_APP_POSTHOG_HOST=$GATSBY_APP_POSTHOG_HOST"
            echo "GATSBY_APP_POSTHOG_DEPLOYMENT_ENV=${GATSBY_APP_POSTHOG_DEPLOYMENT_ENV:-production}"
            echo "GATSBY_APP_POSTHOG_NATIVE_CAPTURE_ENABLED=${GATSBY_APP_POSTHOG_NATIVE_CAPTURE_ENABLED:-false}"
            echo "GATSBY_APP_POSTHOG_PRODUCTION_CAPTURE_ENABLED=${GATSBY_APP_POSTHOG_PRODUCTION_CAPTURE_ENABLED:-false}"
          } >> .env
        env:
          GATSBY_APP_SANITY_TOKEN: ${{ secrets.GATSBY_APP_SANITY_TOKEN }}
          SANITY_PROJECT_ID: ${{ secrets.GATSBY_APP_SANITY_PROJECT_ID }}
          GATSBY_APP_SANITY_DATASET: ${{ secrets.GATSBY_APP_SANITY_DATASET }}
          GATSBY_APP_GA_ID: ${{ secrets.GATSBY_APP_GA_ID }}
          GATSBY_APP_POSTHOG_KEY: ${{ secrets.GATSBY_APP_POSTHOG_KEY }}
          GATSBY_APP_POSTHOG_HOST: ${{ secrets.GATSBY_APP_POSTHOG_HOST }}
          GATSBY_APP_POSTHOG_DEPLOYMENT_ENV: ${{ vars.GATSBY_APP_POSTHOG_DEPLOYMENT_ENV }}
          GATSBY_APP_POSTHOG_NATIVE_CAPTURE_ENABLED: ${{ vars.GATSBY_APP_POSTHOG_NATIVE_CAPTURE_ENABLED }}
          GATSBY_APP_POSTHOG_PRODUCTION_CAPTURE_ENABLED: ${{ vars.GATSBY_APP_POSTHOG_PRODUCTION_CAPTURE_ENABLED }}

      - name: Build application
        run: pnpm build

      - name: Configure AWS credentials
        # v6.2.3
        uses: "aws-actions/configure-aws-credentials@\
          e6de054238d6b7531b4efff3b6587d9aade6a06c"
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-${{ github.run_id }}
          aws-region: ap-northeast-2

      - name: Deploy to S3
        run: pnpm deploy

      - name: Deploy Sanity Studio
        if: github.event_name == 'release'
        run: pnpm --dir studio run deploy
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
